version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "12:00"
      timezone: Asia/Singapore
    ignore:
      # NativeWind 4 on mobile needs Tailwind CSS 3, and Dependabot only updates a pnpm workspace from its root, so
      # majors are upgraded by hand.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      # The Expo SDK pins the React Native minor; both are upgraded together.
      - dependency-name: react-native
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

    open-pull-requests-limit: 100
    groups:
      # First, so a patch that no longer applies fails only this PR.
      patched:
        patterns:
          - "@follow-app/client-sdk"
          - re-resizable
          - react-native-ios-utilities
          - react-native-sheet-transitions
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: cargo
    directory: /server
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 100
