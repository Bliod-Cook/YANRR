[package]
name = "yanrr"
version = "0.1.8"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
axum = { version = "0.8", features = ["macros", "multipart"] }
better-auth = { git = "https://github.com/better-auth-rs/better-auth-rs", rev = "9f91cd7fdb8a5f73a9c69d5c56d363468a7dc281", default-features = false, features = ["axum", "seaorm2", "rustls"] }
chrono = { version = "0.4", features = ["serde"] }
dom_query = "0.28"
dom_smoothie = "0.18"
feed-rs = "3"
figment = { version = "0.10", features = ["toml", "env"] }
futures = "0.3"
isolang = { version = "2", default-features = false }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
log = "0.4"
# Only enables vendored OpenSSL for better-auth-api, which depends on it directly.
openssl = { version = "0.10", features = ["vendored"] }
quick-xml = "0.42"
rayon = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }
scraper = "0.24"
sea-orm = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-json", "postgres-array"] }
sea-orm-migration = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tantivy = { version = "0.25", default-features = false, features = ["mmap"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
toml = "1"
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
whatlang = "0.18"

[dev-dependencies]
figment = { version = "0.10", features = ["test"] }
flate2 = "1"
postgresql_embedded = { version = "0.22", default-features = false, features = ["bundled", "tokio", "tls-rustls-ring"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "multipart", "rustls-tls"] }
tempfile = "3"
