# An environment variable YANRR_<SECTION>__<KEY> (e.g. YANRR_AUTH__SECRET) overrides the key in this file.

[server]
listen = "0.0.0.0:3000"
# The URL clients use; an https:// URL makes session cookies Secure.
public_url = "http://localhost:3000"
# Web client build served on every non-API path (optional).
# web_dir = "web"

[database]
url = "postgres://yanrr:yanrr@localhost/yanrr"

[auth]
# At least 32 random characters; signs session cookies.
secret = ""
# Turn off once your accounts exist.
registration = true

[rsshub]
url = "https://rsshub.app"

[icons]
# Where icons of sites whose feeds have none come from: "google" (Google's favicon service), "google-cn" (the same
# service on Google's mainland China domain, for servers that cannot reach Google) or "direct" (the sites themselves).
provider = "google"

[inbox]
# Bearer token your inbound mail service posts emails to /api/inboxes/email with (optional; emails are refused
# without it). Mail to <handle>@<any domain> goes to the inbox with that handle.
# email_secret = ""

# Push notifications (optional), sent through Firebase Cloud Messaging.
# [push]
# Service account key of the Firebase project the clients are built with
# (VITE_FIREBASE_CONFIG on desktop and web, GOOGLE_SERVICES_JSON / GOOGLE_SERVICE_INFO_PLIST on mobile).
# firebase_service_account = "firebase-service-account.json"

# AI summaries and translations (optional), by a model behind an OpenAI-compatible Chat Completions API.
# [ai]
# base_url = "https://api.openai.com/v1"
# Leave out for servers that need none, such as Ollama at http://localhost:11434/v1.
# api_key = ""
# model = "gpt-5-mini"
