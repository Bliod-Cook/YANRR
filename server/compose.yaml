# Copy config.example.toml to config.toml next to this file, then in it:
#   - set server.public_url and auth.secret
#   - uncomment web_dir = "web"
#   - point database.url at postgres://yanrr:yanrr@postgres/yanrr
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: yanrr
      POSTGRES_PASSWORD: yanrr
      POSTGRES_DB: yanrr
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "yanrr"]
      interval: 5s
      timeout: 5s
      retries: 10

  yanrr:
    image: ghcr.io/bliod-cook/yanrr:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./config.toml:/app/config.toml:ro

volumes:
  postgres:
