# Save example.env as .env next to this file and fill it in; see docs/self-hosting.md.
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: yanrr
      POSTGRES_PASSWORD: yanrr
      POSTGRES_DB: yanrr
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "yanrr"]
      interval: 5s
      timeout: 5s
      retries: 10

  yanrr:
    image: ghcr.io/bliod-cook/yanrr:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # The server doesn't handle SIGTERM as PID 1
    init: true
    env_file: .env
    environment:
      YANRR_DATABASE__URL: postgres://yanrr:yanrr@postgres/yanrr
    # For a reverse proxy on this host
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2
    profiles: [caddy]
    restart: unless-stopped
    command: caddy reverse-proxy --from ${YANRR_SERVER__PUBLIC_URL} --to yanrr:3000
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy:/data

volumes:
  postgres:
  caddy:
