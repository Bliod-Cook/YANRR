# Save example.env as .env next to this file and fill it in; see docs/self-hosting.md.
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: yanrr
      POSTGRES_PASSWORD: yanrr
      POSTGRES_DB: yanrr
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "yanrr"]
      interval: 5s
      timeout: 5s
      retries: 10

  yanrr:
    image: ghcr.io/bliod-cook/yanrr:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      YANRR_DATABASE__URL: postgres://yanrr:yanrr@postgres/yanrr
    # The search index, rebuilt from the database when missing
    volumes:
      - data:/data
    # For a reverse proxy on this host
    ports:
      - "127.0.0.1:3000:3000"

  # Optional; see "Image proxy" in docs/self-hosting.md
  image-proxy:
    image: ghcr.io/bliod-cook/yanrr-image-proxy:latest
    profiles: [image-proxy]
    restart: unless-stopped
    environment:
      YANRR_IMAGE_PROXY__KEY: ${YANRR_IMAGE_PROXY__KEY:-}
    ports:
      - "127.0.0.1:3001:3001"

  caddy:
    image: caddy:2
    profiles: [caddy]
    restart: unless-stopped
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy:/data

configs:
  caddyfile:
    content: |
      ${YANRR_SERVER__PUBLIC_URL} {
        handle_path /image-proxy/* {
          reverse_proxy image-proxy:3001
        }
        handle {
          reverse_proxy yanrr:3000
        }
      }

volumes:
  postgres:
  data:
  caddy:
