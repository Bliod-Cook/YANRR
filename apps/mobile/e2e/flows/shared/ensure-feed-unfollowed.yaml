appId: io.github.bliodcook.yanrr
---
# An account that ran the flows before follows the feed still
- tapOn:
    id: tab-SubscriptionsTabScreen
- runFlow:
    when:
      visible: Yanrr E2E
    commands:
      - longPressOn: Yanrr E2E
      - extendedWaitUntil:
          visible: Unfollow
          timeout: 10000
      - tapOn: Unfollow
      - tapOn:
          text: Unfollow
      - extendedWaitUntil:
          notVisible: Yanrr E2E
          timeout: 20000
- assertVisible:
    id: tab-IndexTabScreen
