appId: io.github.bliodcook.yanrr
---
- extendedWaitUntil:
    visible:
      id: login-screen
    timeout: 60000
# A device someone signed in on before opens the screen on signing in already
- runFlow:
    when:
      visible: Already have an account? Sign in
    commands:
      - tapOn:
          id: auth-toggle-mode
- extendedWaitUntil:
    visible: Don't have an account? Sign up
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: login-email-input
    timeout: 15000
- tapOn:
    id: login-email-input
- inputText: ${E2E_EMAIL}
- tapOn:
    id: login-password-input
- eraseText
- inputText: ${E2E_PASSWORD}
- tapOn:
    id: login-submit
- extendedWaitUntil:
    notVisible:
      id: login-screen
    timeout: 30000
- assertNotVisible:
    id: login-screen
