appId: io.github.bliodcook.yanrr
---
- tapOn:
    id: tab-DiscoverTabScreen
- tapOn:
    id: discover-search-input
- inputText: yanrr://onboarding
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: discover-feed-follow-action
    timeout: 20000
- tapOn:
    id: discover-feed-follow-action
- extendedWaitUntil:
    visible:
      id: follow-submit
    timeout: 20000
- tapOn:
    id: follow-submit
- tapOn:
    id: tab-SubscriptionsTabScreen
- extendedWaitUntil:
    visible: Welcome to Yanrr
    timeout: 20000
- assertVisible: Welcome to Yanrr
- assertVisible:
    id: tab-IndexTabScreen
