appId: io.github.bliodcook.yanrr
name: Android cold-start queued follow route
---
- stopApp
- openLink: "yanrr://add?url=yanrr%3A%2F%2Fonboarding&type=url"
- extendedWaitUntil:
    visible:
      id: follow-submit
    timeout: 30000
- assertVisible: Welcome to Yanrr
- assertNotVisible:
    id: login-screen
- pressKey: Back
- tapOn:
    id: tab-SettingsTabScreen
- assertVisible:
    id: settings-general-link
- tapOn:
    id: tab-IndexTabScreen
