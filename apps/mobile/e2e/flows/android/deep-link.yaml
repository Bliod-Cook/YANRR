appId: io.github.bliodcook.yanrr
name: Android cold-start queued follow route
---
- stopApp
- openLink: "yanrr://add?url=${encodeURIComponent(E2E_FEED_URL)}&type=url"
- extendedWaitUntil:
    visible:
      id: follow-submit
    timeout: 30000
- assertVisible: Yanrr E2E
- assertNotVisible:
    id: login-screen
- pressKey: Back
- tapOn:
    id: tab-SettingsTabScreen
- assertVisible:
    id: settings-general-link
- tapOn:
    id: tab-IndexTabScreen
