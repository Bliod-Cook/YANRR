appId: io.github.bliodcook.yanrr
name: Android tab registration and session persistence
---
- repeat:
    times: 3
    commands:
      - tapOn:
          id: tab-SettingsTabScreen
      - assertVisible:
          id: settings-general-link
      - tapOn:
          id: tab-SubscriptionsTabScreen
      - assertVisible: Yanrr E2E
      - tapOn:
          id: tab-DiscoverTabScreen
      - assertVisible:
          id: discover-search-input
      - tapOn:
          id: tab-IndexTabScreen
      - assertVisible:
          id: timeline-entry-first
- tapOn:
    id: timeline-view-videos
- tapOn:
    id: tab-SubscriptionsTabScreen
- assertVisible:
    id: timeline-view-videos
- extendedWaitUntil:
    notVisible: Yanrr E2E
    timeout: 10000
- tapOn:
    id: timeline-view-articles
- extendedWaitUntil:
    visible: Yanrr E2E
    timeout: 10000
- tapOn:
    id: tab-IndexTabScreen
- extendedWaitUntil:
    visible:
      id: timeline-entry-first
    timeout: 10000
- launchApp
- extendedWaitUntil:
    visible:
      id: timeline-entry-first
    timeout: 30000
- assertNotVisible:
    id: login-screen
- tapOn:
    id: tab-SettingsTabScreen
- assertVisible:
    id: settings-general-link
- tapOn:
    id: tab-IndexTabScreen
- assertVisible:
    id: timeline-entry-first
