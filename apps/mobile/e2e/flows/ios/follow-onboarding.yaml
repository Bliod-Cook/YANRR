appId: io.github.bliodcook.yannr
---
- runFlow:
    file: ./dismiss-overlays.yaml
- tapOn:
    text: Discover
- tapOn:
    id: discover-search-input
- eraseText
- inputText: yannr://onboarding
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: discover-feed-follow-action
    timeout: 20000
- tapOn:
    id: discover-feed-follow-action
- runFlow:
    when:
      visible:
        id: follow-submit
    commands:
      - tapOn:
          id: follow-submit
- runFlow:
    when:
      visible:
        id: follow-unfollow
    commands:
      - tapOn:
          id: navigation-back
- tapOn:
    text: Subscriptions
- extendedWaitUntil:
    visible: Welcome to Yannr
    timeout: 20000
- assertVisible: Welcome to Yannr
